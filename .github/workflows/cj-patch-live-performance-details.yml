name: CJ Patch Live Performance Sample Details
on:
  push:
    paths:
      - '.github/workflows/cj-patch-live-performance-details.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Add sample detail timestamps to Live Performance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()

          old1='''<strong>Rebooking campaign created</strong><span class="cjx-copy">Recent campaign activity</span>'''
          new1='''<strong>Rebooking campaign created</strong><span class="cjx-copy">Sent to 127 recent customers • 2 hours ago</span>'''
          old2='''<strong>Journey AI marketing image saved</strong><span class="cjx-copy">Saved to Journey AI Image Library</span>'''
          new2='''<strong>Journey AI marketing image saved</strong><span class="cjx-copy">Saved to Journey AI Image Library • 4 hours ago</span>'''
          old3='''<strong>Board 01 route updated</strong><span class="cjx-copy">Pay → Review → Book</span>'''
          new3='''<strong>Board 01 route updated</strong><span class="cjx-copy">Pay → Review → Book • 6 hours ago</span>'''

          for old,new,label in [(old1,new1,'row1'),(old2,new2,'row2'),(old3,new3,'row3')]:
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f"{label} target count {n}")
              s=s.replace(old,new,1)

          p.write_text(s)
          print("PATCH_OK")
          PY
          git diff --check
          grep -n -m 6 -E "Sent to 127 recent customers|Saved to Journey AI Image Library • 4 hours ago|Pay → Review → Book • 6 hours ago" index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name "createjourney-dev"
          git config user.email "dev@gocreatejourney.com"
          git add index.html
          git commit -m "Add sample detail timestamps to Live Performance"
          git push origin HEAD:main
