name: CJ Patch Command Center Divider
on:
  push:
    paths:
      - '.github/workflows/cj-inspect-shared-header.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Add Setup divider to Command Center only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()

          target="return brand()+chrome(true)+'<h1 class=\"cjx-page-title\">Business Command Center</h1>"
          replacement="return brand()+chrome(true)+'<div class=\"cjx-brand-divider\" aria-hidden=\"true\"></div><h1 class=\"cjx-page-title\">Business Command Center</h1>"

          n=s.count(target)
          if n!=1:
              raise SystemExit(f"Expected one Command Center header target, found {n}")

          s=s.replace(target,replacement,1)
          p.write_text(s)

          print("PATCH_OK")
          print("divider_count",s.count('class="cjx-brand-divider"'))
          PY

          git diff --check
          echo "=== VERIFY SETUP ==="
          grep -n -A4 -B2 -m 1 "Set Up CreateJourney" index.html
          echo "=== VERIFY COMMAND CENTER ==="
          grep -n -o -m 1 "brand()+chrome(true)+'<div class=\"cjx-brand-divider\"[^<]*</div><h1 class=\"cjx-page-title\">Business Command Center" index.html || true

      - name: Commit
        shell: bash
        run: |
          git config user.name "createjourney-dev"
          git config user.email "dev@gocreatejourney.com"
          git add index.html
          git commit -m "Match Command Center header divider to Setup"
          git push origin HEAD:main
