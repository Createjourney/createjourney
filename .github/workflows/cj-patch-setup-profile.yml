name: CJ Verify Setup Profile Header
on:
  push:
    paths:
      - '.github/workflows/cj-patch-setup-profile.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify final Setup header
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text()
          start=s.find("function setup()")
          end=s.find("function active()",start)
          if start<0 or end<0:
              raise SystemExit("Could not isolate setup renderer")
          block=s[start:end]
          checks={
            "setup_uses_profile_header":"return brand()+chrome(true)+" in block,
            "setup_no_standalone_header_call":"chrome(false)" not in block,
            "shared_profile_toggle":"data-cjx-profile-toggle" in s,
            "account_option":"Account &amp; Workspace" in s,
            "settings_option":"Settings &amp; Integrations" in s,
            "admin_option":"data-cjx-admin-toggle" in s,
            "owner_preview":"Owner / Command Center View" in s,
            "setup_preview":"Setup / Onboarding View" in s,
            "platform_admin":"Platform Admin Console" in s,
            "help_option":"Help &amp; Support" in s,
            "signout_option":"Sign Out" in s,
          }
          for k,v in checks.items():
              print(k,"PASS" if v else "FAIL")
          if not all(checks.values()):
              raise SystemExit("Setup profile header verification failed")
          PY
          git diff --check
