name: CreateJourney Hosted App Preflight (read only)
on:
  pull_request:
    paths:
      - '.github/workflows/hosted-app-preflight.yml'
      - 'CNAME'
      - 'index.html'
      - 'assets/cj-journey-capabilities-v1.js'
      - 'assets/cj-sales-center-v1.js'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hosted-app-preflight.yml'
      - 'assets/cj-sales-center-v1.js'
      - 'assets/cj-journey-capabilities-v1.js'
      - 'index.html'
permissions:
  contents: read
jobs:
  probe-existing-hosted-app:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public app availability and existing capability asset
        shell: bash
        run: |
          set -euo pipefail
          APP_URL="https://app.gocreatejourney.com/"
          FALLBACK_URL="https://createjourney.github.io/createjourney/"
          mkdir -p "$RUNNER_TEMP/cj-hosted"
          check() {
            local url="$1"
            local label="$2"
            local output="$RUNNER_TEMP/cj-hosted/$label.html"
            echo "Checking $label at $url"
            curl --fail --silent --show-error --location --retry 2 --max-time 30 --compressed "$url" --output "$output"
            test -s "$output"
            grep -q '<html' "$output"
            grep -q 'cj-journey-capabilities-v1.js' "$output"
            grep -q 'aiWorkspaceMarketingPanel' "$output"
            echo "$label app shell and existing capability reference verified"
          }
          check "$APP_URL" "custom-domain"
          # GitHub Pages project URL may redirect to the CNAME; it must be healthy too.
          check "$FALLBACK_URL" "github-pages"
          curl --fail --silent --show-error --location --retry 2 --max-time 30 --compressed             "https://app.gocreatejourney.com/assets/cj-journey-capabilities-v1.js"             --output "$RUNNER_TEMP/cj-hosted/capabilities.js"
          grep -q 'CJJourneyCapabilities' "$RUNNER_TEMP/cj-hosted/capabilities.js"
          echo "PASS: hosted application is reachable; capability script is published."

      - name: Verify newly published Sales Command Center assets
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://app.gocreatejourney.com/assets"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 20 --compressed               "$BASE/cj-sales-center-v1.js?check=$GITHUB_SHA"               -o "$RUNNER_TEMP/cj-hosted/sales-center.js" &&
              grep -q 'CJSalesCommandCenter' "$RUNNER_TEMP/cj-hosted/sales-center.js" &&
              curl --fail --silent --show-error --location --max-time 20 --compressed               "$BASE/cj-journey-capabilities-v1.js?check=$GITHUB_SHA"               -o "$RUNNER_TEMP/cj-hosted/capabilities-new.js" &&
              grep -q 'cj-sales-center-v1.js' "$RUNNER_TEMP/cj-hosted/capabilities-new.js"; then
              echo "PASS: Sales Command Center sidecar is hosted and referenced."
              exit 0
            fi
            echo "Waiting for GitHub Pages publishing, attempt $attempt/12"
            sleep 10
          done
          echo "FAIL: Sales Command Center assets not yet published" >&2
          exit 1
      - name: Confirm protected Sales backend rejects unauthenticated request
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --location --max-time 20             -o "$RUNNER_TEMP/cj-hosted/backend-unauth.txt" -w '%{http_code}'             -X POST 'https://pbiivpehdatvmyaxwixk.supabase.co/functions/v1/cj-sales-command-center'             -H 'Content-Type: application/json' --data '{"action":"overview"}')"
          if [ "$STATUS" != "401" ] && [ "$STATUS" != "403" ]; then
            echo "Unexpected HTTP status for unauthenticated protected endpoint: $STATUS" >&2
            exit 1
          fi
          echo "PASS: unauthenticated request rejected (HTTP $STATUS)."
