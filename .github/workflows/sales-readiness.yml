name: Sales Readiness Unit + Local Supabase Tests
on:
  pull_request:
    paths:
      - 'supabase/functions/cj-sales-command-center/**'
      - 'supabase/migrations/**'
      - 'tests/sales-command-center-local.sql'
      - 'assets/cj-sales-center-v1.js'
      - 'assets/cj-journey-capabilities-v1.js'
      - 'scripts/sales-readiness.mjs'
      - 'scripts/sales-readiness.test.mjs'
      - '.github/workflows/sales-readiness.yml'
  push:
    paths:
      - 'supabase/functions/cj-sales-command-center/**'
      - 'supabase/migrations/**'
      - 'tests/sales-command-center-local.sql'
      - 'assets/cj-sales-center-v1.js'
      - 'assets/cj-journey-capabilities-v1.js'
      - 'scripts/sales-readiness.mjs'
      - 'scripts/sales-readiness.test.mjs'
      - '.github/workflows/sales-readiness.yml'
permissions:
  contents: read
jobs:
  code-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/sales-readiness.mjs
      - run: node --check scripts/sales-readiness.test.mjs
      - run: node --test scripts/sales-readiness.test.mjs
      - run: node --check assets/cj-sales-center-v1.js
      - run: node --check assets/cj-journey-capabilities-v1.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/cj-sales-command-center/index.ts
  local-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated local Supabase stack
        run: supabase start
      - name: Apply repository migrations to isolated database
        run: supabase db reset --local --yes
      - name: Check campaign schema, grants, and RLS
        shell: bash
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n1)"
          if [ -z "$DB_CONTAINER" ]; then
            echo 'Local Supabase Postgres container not found' >&2
            exit 1
          fi
          docker exec -i "$DB_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/sales-command-center-local.sql
      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --no-backup || true
