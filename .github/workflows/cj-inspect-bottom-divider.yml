name: CJ Move Bottom Divider
on:
  push:
    paths:
      - '.github/workflows/cj-inspect-bottom-divider.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply divider positioning patch
        run: python scripts/cj_move_bottom_divider.py
      - name: Verify only requested bottom-area changes
        run: |
          git diff --check
          grep -n -A75 -B2 "cj-bottom-nav-visibility-v1" index.html
      - name: Commit
        run: |
          git config user.name "createjourney-dev"
          git config user.email "dev@gocreatejourney.com"
          git add index.html
          git commit -m "Move bottom divider closer to navigation icons"
          git push origin HEAD:main
