name: CJ Patch Profile Admin Menu
on:
  push:
    paths:
      - '.github/workflows/cj-inspect-profile-admin.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply profile admin patch
        run: python scripts/cj_patch_profile_admin.py
      - name: Verify patch
        run: |
          git diff --check
          grep -n -m 6 -E "data-cjx-profile-toggle|data-cjx-admin-toggle|cj-profile-admin-menu-v1|else if\(admin\)" index.html
      - name: Commit
        run: |
          git config user.name "createjourney-dev"
          git config user.email "dev@gocreatejourney.com"
          git add index.html
          git commit -m "Move Command Center admin views into profile menu"
          git push origin HEAD:main
