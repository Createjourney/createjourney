name: CJ Inspect Profile Admin Menu
on:
  push:
    paths:
      - '.github/workflows/cj-inspect-profile-admin.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact handlers
        shell: bash
        run: |
          sed -n '11218,11258p' index.html
          echo "=== ACCOUNT OPEN/CLOSE ==="
          grep -n -m 30 -E "profileInitial.*addEventListener|closeAccountPanel.*addEventListener|logoutButton.*addEventListener|openAccountPanel|renderAccount|accountPanel.classList" index.html || true
