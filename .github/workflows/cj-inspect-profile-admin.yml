name: CJ Inspect Profile Admin Menu
on:
  push:
    paths:
      - '.github/workflows/cj-inspect-profile-admin.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact profile menu targets
        shell: bash
        run: |
          echo "=== ACCOUNT HTML ==="
          sed -n '1775,1845p' index.html
          echo "=== ACCOUNT FUNCTIONS ==="
          grep -n -m 80 -E "function .*Account|function .*account|accountPanel|accountClose|accountSign|signOut|logout|logOut" index.html || true
          echo "=== CJX CLICK HANDLER ==="
          sed -n '11220,11290p' index.html
          echo "=== CJX CSS ==="
          sed -n '11070,11130p' index.html
