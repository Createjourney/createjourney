name: CJ Verify Profile Admin Menu
on:
  push:
    paths:
      - '.github/workflows/cj-inspect-profile-admin.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify profile admin menu
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text()
          start=s.find("function chrome(showProfile)")
          end=s.find("function setup()",start)
          chrome=s[start:end]
          checks={
            "profile_menu_present": 'data-cjx-profile-toggle' in chrome,
            "account_item": 'Account &amp; Workspace' in chrome,
            "settings_item": 'Settings &amp; Integrations' in chrome,
            "admin_nested": 'data-cjx-admin-toggle' in chrome,
            "owner_option": 'Owner / Command Center View' in chrome,
            "setup_option": 'Setup / Onboarding View' in chrome,
            "platform_admin_option": 'Platform Admin Console' in chrome,
            "help_item": 'Help &amp; Support' in chrome,
            "signout_item": 'Sign Out' in chrome,
            "command_center_no_standalone_admin": "if(showProfile){" in chrome and "}else if(admin){" in chrome,
            "profile_css": 'cj-profile-admin-menu-v1' in s,
            "profile_action_handler": "data-cjx-profile-action" in s,
            "preview_handler": "setAdminPreview(previewChoice.getAttribute('data-cjx-preview')" in s,
          }
          for k,v in checks.items():
              print(k,"PASS" if v else "FAIL")
          if not all(checks.values()):
              raise SystemExit("verification failed")
          PY
          git diff --check
