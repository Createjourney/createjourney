name: CJ Inspect Current UI
on:
  push:
    paths:
      - '.github/workflows/cj-inspect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current index targets
        shell: bash
        run: |
          echo "=== SETUP RANGE ==="
          sed -n '11080,11320p' index.html
          echo "=== DASHBOARD TERMS ==="
          grep -ni -m 80 -E "important numbers|This Week|Business Records|Top 3|Priorities|SmartBoards|Performance|Control Center|profileInitial|account-circle|rolePreview|Platform Admin|platformAdmin|isPlatformAdmin" index.html || true
          echo "=== ROUTE FUNCTIONS ==="
          grep -ni -m 80 -E "function .*dashboard|function .*setup|showOnly\(|openDashboard|renderDashboard|renderSetup|setup.*render|dashboard.*render|dashboardButton|trial.*start|start.*trial" index.html || true
