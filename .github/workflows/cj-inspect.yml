name: CJ Inspect Current UI
on:
  push:
    paths:
      - '.github/workflows/cj-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify admin preview behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text()
          checks={
            "preview_key": "cj_admin_preview_v1" in s,
            "setup_uses_no_profile_chrome": "return brand()+chrome(false)+" in s,
            "command_center_uses_profile_chrome": "return brand()+chrome(true)+" in s,
            "profile_is_conditional": "if(showProfile)controls+='<button class=\"cjx-profile\"" in s,
            "setup_preview_option": 'data-cjx-preview="setup"' in s,
            "owner_preview_option": 'data-cjx-preview="owner"' in s,
            "admin_preview_option": 'data-cjx-preview="admin"' in s,
            "preview_click_handler": "data-cjx-preview" in s and "setAdminPreview" in s,
          }
          for k,v in checks.items(): print(k, "PASS" if v else "FAIL")
          if not all(checks.values()): raise SystemExit("verification failed")
          PY
          echo "=== PREVIEW HANDLERS ==="
          grep -n -m 12 -E "data-cjx-preview|setAdminPreview\(" index.html
          echo "=== HEADER CALLS ==="
          grep -n -m 8 -E "chrome\(false\)|chrome\(true\)|if\(showProfile\)controls" index.html
