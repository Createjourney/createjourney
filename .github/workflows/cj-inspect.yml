name: CJ Inspect Current UI
on:
  push:
    paths:
      - '.github/workflows/cj-inspect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current setup and dashboard hooks
        shell: bash
        run: |
          echo "=== SETUP JS ==="
          sed -n '11120,11270p' index.html
          echo "=== LATEST TAIL ==="
          sed -n '12450,12884p' index.html
          echo "=== CJX HOOKS ==="
          grep -ni -m 120 -E "cjScreenshotHome|cjx-|data-cjh|data-cjx|render.*CJ|setup.*home|home.*setup|dashboard.*home|admin.*view|profile.*icon|account.*panel" index.html || true
