name: CJ Inspect Current UI
on:
  push:
    paths:
      - '.github/workflows/cj-inspect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current index targets
        shell: bash
        run: |
          echo "=== FILE INFO ==="
          wc -c -l index.html
          echo "=== BUSINESS COMMAND CENTER ==="
          grep -ni -m 12 -E "Business Command Center|Command Center|This Week.?s Business Records|Top 3 Priorities" index.html || true
          echo "=== SETUP ==="
          grep -ni -m 20 -E "Set Up CreateJourney|Tell Us About Your Business|Activate Your SmartBoards|Connect Your Business Accounts|How CreateJourney Works|3-Day Journey AI Trial" index.html || true
          echo "=== PROFILE / ADMIN ==="
          grep -ni -m 30 -E "profile|account.*icon|Admin View|admin.*preview|platform.*admin|cj_admin_preview|settings" index.html || true
          echo "=== ROUTING / SCREEN IDS ==="
          grep -ni -m 30 -E "showScreen|showView|setupScreen|dashboardScreen|setup-page|dashboard|homeScreen|command" index.html || true
