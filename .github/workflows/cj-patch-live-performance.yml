name: CJ Patch Live Performance
on:
  push:
    paths:
      - '.github/workflows/cj-patch-live-performance.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch Live Performance section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text()
          
          pattern=r'<div class="cjx-performance-head">.*?</section><div class="cjx-control-heading">'
          replacement='''<div class="cjx-performance-head"><h2 class="cjx-section-title">Live Performance</h2><span class="cjx-live-pill"><i></i>LIVE</span></div><section class="cjx-card cjx-feed cjx-performance-card"><button class="cjx-feed-row" type="button" data-cjh="marketing"><span class="cjx-check">✓</span><span><strong>Rebooking campaign created</strong><span class="cjx-copy">Recent campaign activity</span></span><span class="cjx-arrow">›</span></button><button class="cjx-feed-row" type="button" data-cjh="images"><span class="cjx-check">✓</span><span><strong>Journey AI marketing image saved</strong><span class="cjx-copy">Saved to Journey AI Image Library</span></span><span class="cjx-arrow">›</span></button><button class="cjx-feed-row" type="button" data-cjh="boards"><span class="cjx-check">✓</span><span><strong>Board 01 route updated</strong><span class="cjx-copy">Pay → Review → Book</span></span><span class="cjx-arrow">›</span></button></section><div class="cjx-control-heading">'''
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f"Expected 1 Performance block, found {n}")
          
          marker='cj-live-performance-reference-v1'
          if marker not in s:
              css='''<style id="cj-live-performance-reference-v1">
          #dashboardApp[data-cjx-exact-mode="active"] #cjScreenshotHome .cjx-performance-head{display:flex!important;align-items:center!important;justify-content:flex-start!important;gap:12px!important;margin:18px 0 9px!important}
          #dashboardApp[data-cjx-exact-mode="active"] #cjScreenshotHome .cjx-performance-head .cjx-section-title{margin:0!important;font-size:25px!important;line-height:1!important;letter-spacing:-.75px!important;font-weight:900!important;color:#090b12!important}
          #dashboardApp[data-cjx-exact-mode="active"] #cjScreenshotHome .cjx-live-pill{display:inline-flex!important;align-items:center!important;gap:7px!important;padding:6px 12px!important;border-radius:999px!important;background:#e9faef!important;color:#168f4d!important;font-size:11px!important;line-height:1!important;font-weight:900!important;letter-spacing:.02em!important;box-shadow:none!important}
          #dashboardApp[data-cjx-exact-mode="active"] #cjScreenshotHome .cjx-live-pill i{width:9px!important;height:9px!important;border-radius:50%!important;background:#20b866!important;flex:0 0 auto!important}
          #dashboardApp[data-cjx-exact-mode="active"] #cjScreenshotHome .cjx-performance-card{margin-top:0!important;padding:0 15px!important;border:1px solid #dfe4ea!important;border-radius:16px!important;background:#fff!important;box-shadow:0 4px 14px rgba(15,23,42,.04)!important;overflow:hidden!important}
          #dashboardApp[data-cjx-exact-mode="active"] #cjScreenshotHome .cjx-performance-card .cjx-feed-row{width:100%!important;min-height:64px!important;margin:0!important;padding:11px 2px!important;border:0!important;border-bottom:1px solid #e7ebf0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;display:grid!important;grid-template-columns:38px minmax(0,1fr) 18px!important;gap:12px!important;align-items:center!important;text-align:left!important;color:#0b0d13!important}
          #dashboardApp[data-cjx-exact-mode="active"] #cjScreenshotHome .cjx-performance-card .cjx-feed-row:last-child{border-bottom:0!important}
          #dashboardApp[data-cjx-exact-mode="active"] #cjScreenshotHome .cjx-performance-card .cjx-check{width:34px!important;height:34px!important;border-radius:50%!important;background:#1fb667!important;color:#fff!important;display:grid!important;place-items:center!important;font-size:19px!important;line-height:1!important;font-weight:900!important;box-shadow:0 2px 7px rgba(31,182,103,.2)!important}
          #dashboardApp[data-cjx-exact-mode="active"] #cjScreenshotHome .cjx-performance-card .cjx-feed-row strong{display:block!important;margin:0 0 3px!important;font-size:15px!important;line-height:1.15!important;font-weight:900!important;letter-spacing:-.2px!important;color:#0a0c12!important}
          #dashboardApp[data-cjx-exact-mode="active"] #cjScreenshotHome .cjx-performance-card .cjx-feed-row .cjx-copy{display:block!important;margin:0!important;font-size:12.5px!important;line-height:1.25!important;font-weight:500!important;color:#7a8495!important}
          #dashboardApp[data-cjx-exact-mode="active"] #cjScreenshotHome .cjx-performance-card .cjx-arrow{font-size:27px!important;line-height:1!important;font-weight:300!important;color:#566273!important;justify-self:end!important}
          @media(max-width:560px){
          #dashboardApp[data-cjx-exact-mode="active"] #cjScreenshotHome .cjx-performance-head{gap:9px!important;margin-top:17px!important;margin-bottom:8px!important}
          #dashboardApp[data-cjx-exact-mode="active"] #cjScreenshotHome .cjx-performance-head .cjx-section-title{font-size:23px!important}
          #dashboardApp[data-cjx-exact-mode="active"] #cjScreenshotHome .cjx-live-pill{padding:5px 10px!important;font-size:10px!important}
          #dashboardApp[data-cjx-exact-mode="active"] #cjScreenshotHome .cjx-performance-card{padding:0 13px!important;border-radius:15px!important}
          #dashboardApp[data-cjx-exact-mode="active"] #cjScreenshotHome .cjx-performance-card .cjx-feed-row{min-height:61px!important;grid-template-columns:36px minmax(0,1fr) 16px!important;gap:10px!important;padding:10px 1px!important}
          #dashboardApp[data-cjx-exact-mode="active"] #cjScreenshotHome .cjx-performance-card .cjx-check{width:32px!important;height:32px!important;font-size:18px!important}
          #dashboardApp[data-cjx-exact-mode="active"] #cjScreenshotHome .cjx-performance-card .cjx-feed-row strong{font-size:14px!important}
          #dashboardApp[data-cjx-exact-mode="active"] #cjScreenshotHome .cjx-performance-card .cjx-feed-row .cjx-copy{font-size:11.5px!important}
          }
          </style>'''
              if '</body>' not in s:
                  raise SystemExit("Missing body close")
              s=s.replace('</body>',css+'\n</body>',1)
          
          p.write_text(s)
          print("PATCHED", n)
          print("TITLE_COUNT", s.count("Live Performance"))
          print("REFERENCE_CSS", s.count(marker))
          
          PY
          git diff --check
          echo "=== VERIFY MARKUP ==="
          grep -n -m 3 -E "Live Performance|Rebooking campaign created|Board 01 route updated" index.html
          echo "=== VERIFY CSS ==="
          grep -n -m 3 "cj-live-performance-reference-v1" index.html
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "createjourney-dev"
          git config user.email "dev@gocreatejourney.com"
          git add index.html
          git commit -m "Match Live Performance section to approved reference"
          git push origin HEAD:main
