name: CJ Patch Login Logo Size
on:
  push:
    paths:
      - '.github/workflows/cj-inspect-login-logo.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reduce login logo by 20 percent only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          marker='cj-login-logo-20pct-smaller-v1'
          if marker in s:
              raise SystemExit("login logo size override already exists")
          css='''<style id="cj-login-logo-20pct-smaller-v1">
#authApp .auth-brand .cj-auth-canonical,
#authApp .auth-brand .cj-auth-logo-v4,
#authApp .auth-brand .cj-auth-logo-v3{
  transform:scale(.8)!important;
  transform-origin:center center!important;
}
</style>'''
          if '</body>' not in s:
              raise SystemExit("missing body close")
          s=s.replace('</body>',css+'\n</body>',1)
          p.write_text(s)
          print("PATCH_OK")
          PY
          git diff --check
          grep -n -A8 -B2 "cj-login-logo-20pct-smaller-v1" index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name "createjourney-dev"
          git config user.email "dev@gocreatejourney.com"
          git add index.html
          git commit -m "Reduce login CreateJourney logo by 20 percent"
          git push origin HEAD:main
