name: CJ Patch Login Logo Size
on:
  push:
    paths:
      - '.github/workflows/cj-inspect-login-logo.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply logo-size patch
        run: python scripts/cj_patch_login_logo_size.py
      - name: Verify only logo-size override
        run: |
          git diff --check
          grep -n -A8 -B2 "cj-login-logo-20pct-smaller-v1" index.html
      - name: Commit
        run: |
          git config user.name "createjourney-dev"
          git config user.email "dev@gocreatejourney.com"
          git add index.html
          git commit -m "Reduce login CreateJourney logo by 20 percent"
          git push origin HEAD:main
