name: CJ Inspect Login Logo
on:
  push:
    paths:
      - '.github/workflows/cj-inspect-login-logo.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect all login logo rules
        shell: bash
        run: |
          grep -n -m 80 -E "cj-auth-logo-v2|cj-auth-logo-text|cj-auth-logo-arrow|cj-powered|auth-brand" index.html || true
