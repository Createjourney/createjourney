name: CJ Inspect Login Logo
on:
  push:
    paths:
      - '.github/workflows/cj-inspect-login-logo.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect canonical login logo rules
        shell: bash
        run: |
          sed -n '11535,11635p' index.html
