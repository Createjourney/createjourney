name: Journey AI routing regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/journey-ai-routing.test.mjs'
      - '.github/workflows/journey-ai-routing.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/journey-ai-routing.test.mjs'
      - '.github/workflows/journey-ai-routing.yml'
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/journey-ai-routing.test.mjs
