name: Journey AI Platform Knowledge M2
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261111_platform_knowledge_registry_v1.sql'
      - 'supabase/functions/journey-ai-platform-knowledge/**'
      - 'scripts/platform-knowledge-build.mjs'
      - 'scripts/platform-knowledge-import.mjs'
      - 'tests/platform-knowledge-build.test.mjs'
      - 'tests/platform-knowledge-import.test.mjs'
      - '.github/workflows/platform-knowledge-m2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/platform-knowledge-build.mjs
      - run: node --check scripts/platform-knowledge-import.mjs
      - run: node --test tests/platform-knowledge-build.test.mjs tests/platform-knowledge-import.test.mjs
      - name: Build unverified staging snapshot
        run: node scripts/platform-knowledge-build.mjs . "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        with:
          name: journey-ai-m2-staged-knowledge
          path: artifacts/platform-intelligence/knowledge-staged.json
          retention-days: 14
  edge-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/journey-ai-platform-knowledge/index.ts
  postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Supabase database roles
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN;"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated NOLOGIN;"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE service_role NOLOGIN BYPASSRLS;"
      - name: Apply additive migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261111_platform_knowledge_registry_v1.sql
      - name: Confirm four RLS tables, no anon/auth direct privileges
        run: |
          psql -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename LIKE 'cj_platform_knowledge_%' AND rowsecurity" | grep -qx 4
          psql -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM information_schema.role_table_grants WHERE grantee IN ('anon','authenticated') AND table_schema='public' AND table_name LIKE 'cj_platform_knowledge_%'" | grep -qx 0
      - name: Ensure unverified version cannot be marked VERIFIED
        run: |
          if psql -v ON_ERROR_STOP=1 -c "INSERT INTO public.cj_platform_knowledge_versions(environment,source_commit,artifact_sha256,state) VALUES('production',repeat('a',40),repeat('b',64),'VERIFIED');"; then
            echo 'FAIL: Verified status without evidence was accepted' >&2
            exit 1
          fi
          echo 'PASS: Verified status rejected without release evidence'
      - name: Check staging version and node-edge foreign key
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.cj_platform_knowledge_versions(id,environment,source_commit,artifact_sha256) VALUES('00000000-0000-4000-8000-000000000001','staging',repeat('a',40),repeat('b',64));
          INSERT INTO public.cj_platform_knowledge_nodes(version_id,node_key,node_kind,name) VALUES('00000000-0000-4000-8000-000000000001','page:home','page','Home');
          INSERT INTO public.cj_platform_knowledge_nodes(version_id,node_key,node_kind,name) VALUES('00000000-0000-4000-8000-000000000001','page:marketing','page','Marketing');
          INSERT INTO public.cj_platform_knowledge_edges(version_id,from_node_key,to_node_key,relation_type) VALUES('00000000-0000-4000-8000-000000000001','page:home','page:marketing','navigates_to');
          SELECT COUNT(*) FROM public.cj_platform_knowledge_edges;
          SQL

  anonymous-dom-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium webkit
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/cj-m2-http.log 2>&1 &
      - name: Collect anonymous UI relationships
        env:
          CJ_AUDIT_OUT_DIR: /tmp/cj-m2-browser
        run: node scripts/platform-intelligence-browser-inventory.mjs
      - name: Build unverified graph with browser evidence
        env:
          CJ_KNOWLEDGE_BROWSER_EVIDENCE: /tmp/cj-m2-browser/anonymous-browser-inventory.json
          CJ_KNOWLEDGE_OUTPUT: artifacts/platform-intelligence/knowledge-with-anonymous-dom.json
        run: node scripts/platform-knowledge-build.mjs . "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        with:
          name: journey-ai-m2-knowledge-anonymous-dom
          path: |
            artifacts/platform-intelligence/knowledge-with-anonymous-dom.json
            /tmp/cj-m2-browser/anonymous-browser-inventory.json
          retention-days: 14
