name: Flourished Images Marketing Launch Squad V1
on:
  pull_request:
    paths:
      - 'supabase/functions/cj-marketing-launch-squad/**'
      - 'supabase/functions/journey-ai-chat/**'
      - 'supabase/migrations/*marketing_brand_workspaces*'
      - 'tests/marketing-launch-squad.test.mjs'
      - '.github/workflows/marketing-launch-squad.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/cj-marketing-launch-squad/**'
      - 'supabase/functions/journey-ai-chat/**'
      - 'tests/marketing-launch-squad.test.mjs'
permissions:
  contents: read
jobs:
  marketing-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/marketing-launch-squad.test.mjs tests/journey-ai-workforce-answer.test.mjs tests/journey-ai-activation-plan.test.mjs
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/cj-marketing-launch-squad/index.ts
      - run: deno check supabase/functions/journey-ai-chat/index.ts
