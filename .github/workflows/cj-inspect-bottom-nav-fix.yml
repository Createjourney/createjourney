name: CJ Fix Bottom Nav Visibility
on:
  push:
    paths:
      - '.github/workflows/cj-inspect-bottom-nav-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply fix
        run: python scripts/cj_fix_bottom_nav_visibility.py
      - name: Verify diff
        run: |
          git diff --check
          grep -n -A60 -B2 "cj-bottom-nav-visibility-v1" index.html
      - name: Commit
        run: |
          git config user.name "createjourney-dev"
          git config user.email "dev@gocreatejourney.com"
          git add index.html
          git commit -m "Fix bottom nav visibility and AI control spacing"
          git push origin HEAD:main
