name: CJ Patch Bottom Nav Controls
on:
  push:
    paths:
      - '.github/workflows/cj-patch-bottom-nav.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply patch
        run: python scripts/cj_patch_bottom_nav.py
      - name: Verify
        run: |
          git diff --check
          grep -n -A50 -B2 "cj-bottom-nav-visibility-v1" index.html
      - name: Commit
        run: |
          git config user.name "createjourney-dev"
          git config user.email "dev@gocreatejourney.com"
          git add index.html
          git commit -m "Improve bottom navigation and Journey AI controls"
          git push origin HEAD:main
