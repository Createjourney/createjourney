<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreateJourney</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fbff;
      color: #111827;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: white;
      padding: 42px 28px;
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,.08);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 42px;
    }

    .journey {
      color: #69aaf7;
    }

    p {
      color: #667085;
      line-height: 1.6;
      font-size: 17px;
    }

    .button {
      display: block;
      margin-top: 26px;
      padding: 16px;
      border-radius: 12px;
      background: #69aaf7;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }

    .secondary {
      background: #eef6ff;
      color: #397fcf;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <h1>Create<span class="journey">Journey</span></h1>

      <p>
        One tap. The right next step.
      </p>

      <p>
        Connect your customers to payments, reviews,
        bookings and more through one simple journey.
      </p>

      <a class="button" href="#">Get Started</a>
      <a class="button secondary" href="#">Business Login</a>
    </section>
  </main>
</body>
</html>
