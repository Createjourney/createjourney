<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CreateJourney</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#f7f9fd;color:#13243a;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center}main{text-align:center;width:min(100%,460px);padding:30px 22px}.brand{font-weight:800;font-size:29px;letter-spacing:-1px}.mark{display:inline-grid;place-items:center;background:#1479e8;color:#fff;border-radius:15px;width:51px;height:51px;font-size:28px;margin-bottom:14px}h1{font-size:27px;margin:18px 0 9px}p{line-height:1.5;color:#53647a}.progress{font-size:13px;font-weight:700;letter-spacing:.12em;color:#45729d}button{cursor:pointer;border:0;background:#1479e8;color:white;border-radius:50%;width:76px;height:76px;font-size:36px;margin:28px auto;display:grid;place-items:center;box-shadow:0 5px 20px #1479e844}button.pulse{animation:pulse 1.5s ease-in-out infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #1479e855}55%{box-shadow:0 0 0 17px #1479e800}}@media(prefers-reduced-motion:reduce){button.pulse{animation:none;outline:4px solid #b3d7fa}}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.piece{position:absolute;top:-15px;width:9px;height:15px;animation:fall 2.8s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(700deg);opacity:0}}.error{color:#a32323}small{color:#617188}</style></head><body><main id="app" aria-live="polite"><div class="mark" aria-hidden="true">➜</div><div class="brand">CreateJourney</div><p>Loading your Journey…</p></main><div class="confetti" id="confetti"></div>
<script>
"use strict";
const API="https://pbiivpehdatvmyaxwixk.supabase.co/functions/v1/journey-public";
const TOKEN=new URLSearchParams(location.search).get("board")||"";
const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
const app=document.getElementById("app"),brand='<div class="mark" aria-hidden="true">➜</div><div class="brand">CreateJourney</div>';
const key="cj_public_progress_"+TOKEN;let actions=[];
function error(message){app.innerHTML=brand+'<p class="error" role="alert"></p>';app.querySelector("p").textContent=message}
function done(){app.innerHTML=brand+'<h1>Thank You!</h1><p>Your Journey is complete.</p>';const box=document.getElementById("confetti");if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const colors=["#1479e8","#67b9ff","#ffd166","#8ed8b6"];for(let i=0;i<65;i++){const d=document.createElement("i");d.className="piece";d.style.left=(Math.random()*100)+"%";d.style.background=colors[i%colors.length];d.style.animationDelay=(Math.random()*1.2)+"s";box.append(d)}setTimeout(()=>box.replaceChildren(),4500)}
function getProgress(){try{const p=JSON.parse(sessionStorage.getItem(key)||"null");return p&&p.index>=0&&p.index<=actions.length?p:{index:0,opened:false}}catch{return {index:0,opened:false}}}
function save(p){sessionStorage.setItem(key,JSON.stringify(p))}
function render(){const p=getProgress();if(p.index>=actions.length){done();return}const a=actions[p.index];if(!p.opened){save({index:p.index,opened:true});location.assign(a.url);return}const isLast=p.index===actions.length-1;app.innerHTML=brand+'<p class="progress"></p><h1></h1><p class="hint"></p><button class="pulse" type="button" aria-label=""></button><small>Continue when you have finished in the previous app.</small>';app.querySelector(".progress").textContent="STEP "+(p.index+1)+" OF "+actions.length;app.querySelector("h1").textContent=a.type==="pay"?"Payment":a.type==="review"?"Google Review":a.type==="book"?"Booking":"Your Journey";app.querySelector(".hint").textContent="When finished, tap the arrow to continue.";const btn=app.querySelector("button");btn.textContent=isLast?"✓":"➜";btn.setAttribute("aria-label",isLast?"Finish Journey":"Continue to next Journey step");btn.onclick=()=>{save({index:p.index+1,opened:false});render()}}
async function start(){if(!UUID.test(TOKEN)){error("This SmartBoard link is invalid.");return}try{const response=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"resolve_board",board_id:TOKEN})});if(!response.ok)throw Error("Unable to load this SmartBoard.");const data=await response.json();const board=data.board;if(!board||!Array.isArray(board.actions))throw Error("No published Journey found.");actions=board.actions.map(type=>({type,url:board.destinations?.[type]})).filter(x=>typeof x.url==="string"&&/^https:\/\//i.test(x.url));if(!actions.length)throw Error("This SmartBoard has no published destinations.");render()}catch(e){error(e.message||"Journey temporarily unavailable.")}}
start();
</script></body></html>
