<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CreateJourney</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#f7f9fd;color:#13243a;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center}main{text-align:center;width:min(100%,460px);padding:30px 22px}.brand{font-weight:800;font-size:29px;letter-spacing:-1px}.mark{display:inline-grid;place-items:center;background:#1479e8;color:#fff;border-radius:15px;width:51px;height:51px;font-size:28px;margin-bottom:14px}h1{font-size:27px;margin:18px 0 9px}p{line-height:1.5;color:#53647a}.progress{font-size:13px;font-weight:700;letter-spacing:.12em;color:#45729d}button{cursor:pointer;border:0;background:#1479e8;color:white;border-radius:50%;width:76px;height:76px;font-size:36px;margin:28px auto;display:grid;place-items:center;box-shadow:0 5px 20px #1479e844}button.pulse{animation:pulse 1.5s ease-in-out infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #1479e855}55%{box-shadow:0 0 0 17px #1479e800}}@media(prefers-reduced-motion:reduce){button.pulse{animation:none;outline:4px solid #b3d7fa}}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.piece{position:absolute;top:-15px;width:9px;height:15px;animation:fall 2.8s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(700deg);opacity:0}}.error{color:#a32323}small{color:#617188}.journey-link{display:block;padding:18px 16px;background:#1479e8;color:#fff;border-radius:14px;text-decoration:none;font-weight:750;margin:24px auto 12px;min-height:56px}.journey-link:focus-visible,.next-step:focus-visible{outline:3px solid #173f7c;outline-offset:3px}.next-step{border-radius:13px;width:100%;height:auto;min-height:54px;font-size:16px;background:#243a56;margin:8px auto;padding:12px}.next-step[hidden]{display:none}</style></head><body><main id="app" aria-live="polite"><div class="mark" aria-hidden="true">➜</div><div class="brand">CreateJourney</div><p>Loading your Journey…</p></main><div class="confetti" id="confetti"></div>
<script>
"use strict";
const API="https://pbiivpehdatvmyaxwixk.supabase.co/functions/v1/journey-public";
const API_KEY="sb_publishable_Nrvj4ylZi3jkqlecBSpTHA_PYxxV3Os";
const TOKEN=new URLSearchParams(location.search).get("board")||"";
const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
const app=document.getElementById("app"),brand='<div class="mark" aria-hidden="true">➜</div><div class="brand">CreateJourney</div>';
let actions=[];let current=0;let opened=false;let businessName="CreateJourney";
function error(message){app.innerHTML=brand+'<p class="error" role="alert"></p>';app.querySelector("p").textContent=message}
function done(){app.replaceChildren();const h=document.createElement("h1");h.textContent="Thank you!";const p=document.createElement("p");p.textContent="You have reached the end of this Journey.";const reset=document.createElement("button");reset.type="button";reset.textContent="↻";reset.setAttribute("aria-label","Start Journey again");reset.addEventListener("click",()=>{current=0;opened=false;render()});app.append(h,p,reset)}
function render(){if(current>=actions.length){done();return}const step=actions[current];app.replaceChildren();const name=document.createElement("div");name.className="brand";name.textContent=businessName;const count=document.createElement("p");count.className="progress";count.textContent="STEP "+(current+1)+" OF "+actions.length;const h=document.createElement("h1");h.textContent=step.label;const detail=document.createElement("p");detail.textContent=opened?"When you're ready, continue to the next step.":"Tap below to open this step in a new tab. Return here to continue.";const open=document.createElement("a");open.href=step.url;open.target="_blank";open.rel="noopener noreferrer";open.className="journey-link";open.textContent=opened?"Open "+step.label+" again":"Open "+step.label;open.addEventListener("click",()=>{opened=true;detail.textContent="When you're ready, continue to the next step.";next.hidden=false;next.textContent=current===actions.length-1?"Finish Journey":"Continue to next step"});const next=document.createElement("button");next.type="button";next.className="next-step";next.hidden=!opened;next.textContent=current===actions.length-1?"Finish Journey":"Continue to next step";next.addEventListener("click",()=>{current++;opened=false;render()});app.append(name,count,h,detail,open,next)}
async function start(){if(!UUID.test(TOKEN)){error("This SmartBoard link is invalid.");return}try{const response=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":API_KEY},body:JSON.stringify({action:"resolve_board",board_id:TOKEN})});if(!response.ok)throw Error("Unable to load this SmartBoard.");const data=await response.json();const board=data.board;if(!board||!Array.isArray(board.actions))throw Error("No published Journey found.");actions=board.actions.map(type=>({type,url:board.destinations?.[type],label:({pay:"Pay Now",review:"Leave a Review",book:"Book Appointment",subscribe:"Subscribe",website:"Visit Website",custom:"Continue"})[type]||"Continue"})).filter(x=>typeof x.url==="string"&&/^https:\/\//i.test(x.url));if(!actions.length)throw Error("This SmartBoard has no published destinations.");businessName=board.business_name||board.name||"CreateJourney";render()}catch(e){error(e.message||"Journey temporarily unavailable.")}}
start();
</script></body></html>
